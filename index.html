<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Türk TV</title><style>*{box-sizing:border-box;margin:0;padding:0}body,html{width:1920px;height:1080px;overflow:hidden;background:#111;color:#eee;font-family:sans-serif}#hdr{height:90px;padding:20px 50px;font-size:40px;font-weight:700;background:#a00d26;display:flex;justify-content:space-between;align-items:center}#hdr small{font-size:24px;font-weight:400;opacity:.85}#tabs{display:flex;gap:16px;padding:16px 50px}.tab{padding:10px 26px;border-radius:30px;background:#2a2a2a;font-size:26px}.tab.on{background:#eee;color:#111}.tab.sel{outline:5px solid #ffcc00;transform:scale(1.08)}#grid{position:absolute;top:180px;left:50px;right:50px;bottom:60px;overflow:hidden}#inner{display:flex;flex-wrap:wrap;gap:18px}.ch{width:348px;height:110px;background:#222;border-radius:10px;padding:14px 18px;font-size:27px;display:flex;align-items:center;gap:14px;border:4px solid transparent;overflow:hidden}.ch img,.ch .lg{width:72px;height:72px;object-fit:contain;flex:none}.ch .lg{border-radius:12px;color:#fff;font-size:30px;line-height:72px;text-align:center;font-weight:700}.ch span{overflow:hidden;max-height:70px}.ch.f{border-color:#fff;background:#3a3a3a}.ch.fav span:after{content:" ★";color:#fc0}#foot{position:absolute;bottom:0;left:0;right:0;height:56px;padding:12px 50px;font-size:22px;opacity:.7}#player{position:absolute;left:0;top:0;width:1920px;height:1080px;background:#000;display:none}#av,#vid{position:absolute;left:0;top:0;width:1920px;height:1080px}#osd{position:absolute;left:50px;bottom:60px;padding:16px 30px;background:rgba(0,0,0,.7);border-radius:10px;font-size:34px;display:none}#msg{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-size:36px;background:rgba(0,0,0,.8);padding:24px 40px;border-radius:10px;display:none;text-align:center}#add{position:absolute;left:300px;top:350px;width:1320px;background:#222;padding:40px;border-radius:14px;display:none;font-size:28px}#add input{width:100%;font-size:28px;padding:14px;margin-top:20px}</style></head><body><div id="hdr"><div>Türk TV <small>v3</small></div><small id="count"></small></div><div id="tabs"></div><div id="grid"><div id="inner"></div></div><div id="foot">▲ en haut : changer de pays/catégorie (◀ ▶) · OK : regarder · Jaune : favori ★ · Vert : ajouter une liste M3U · Rouge : recharger · Retour : quitter</div><div id="player"><object id="av" type="application/avplayer"></object><video id="vid"></video><div id="osd"></div></div><div id="add">Adresse (URL) d'une liste M3U :<input id="url" type="text"><div style="margin-top:16px;font-size:22px;opacity:.7">OK pour valider · Retour pour annuler</div></div><div id="msg"></div><script src="app.js?v=3"></script></body></html>
